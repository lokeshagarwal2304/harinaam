name: Build Harinaam Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Harinaam-Android-v1.0.2.apk
          echo "APK v1.0.2 Build Completed Successfully."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harinaam-Android-v1.0.2-APK
          path: build-output/Harinaam-Android-v1.0.2.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.2
          name: "Harinaam Android APK v1.0.2 (Complete Professional Release)"
          body: |
            🕉️ **हरिनाम (Harinaam) - Official Android Standalone App v1.0.2**
            
            ### 📥 Download & Install
            1. Download `Harinaam-Android-v1.0.2.apk` below.
            2. Tap and install directly on your Android phone.
            
            ### ✨ Complete Professional Feature Suite:
            - **Spiritual Onboarding Slides**: Beautiful spiritual introduction and carousel walkthrough.
            - **Devotee & Sankalp Setup**: Devotee name input, choice of 4 sacred deities (श्रीराम, राधा कृष्ण, महादेव शिव, खाटू श्याम जी), and daily goals (11, 21, 51, 108).
            - **Ultra-Smooth Calligraphy Slate**: High-FPS fluid touch & stylus strokes with intelligent Devanagari completion recognition.
            - **Divine Darshan Milestone Celebration**: Beautiful darshan & sacred shloka blessing upon completing your daily mala / sankalp.
            - **100% Offline Local Storage**: All profiles, streaks, malas, and counts persist offline securely on your mobile device.
            - **5 Indian Regional Languages**: हिन्दी, English, తెలుగు, தமிழ், ಕನ್ನಡ.
            - **Instant Clear & WakeLock**: Top & bottom fast clear buttons; prevents screen sleep during chanting.
          files: build-output/Harinaam-Android-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
