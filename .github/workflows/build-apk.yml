name: Build Harinaam Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Harinaam-Android-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harinaam-Android-v1.0.0-APK
          path: build-output/Harinaam-Android-v1.0.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Harinaam Android APK v1.0.0 (Release)"
          body: |
            🕉️ **हरिनाम (Harinaam) - Official Android Standalone App**
            
            - **Download**: Click `Harinaam-Android-v1.0.0.apk` below to download and install on any Android phone.
            - **Features**:
              - Offline Naam Lekhan slate with intelligent Devanagari recognition
              - God Darshan blessing cards
              - Complete 5 regional languages (हिन्दी, English, తెలుగు, தமிழ், ಕನ್ನಡ)
              - Automatic WakeLock to prevent screen sleep while writing
          files: build-output/Harinaam-Android-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
